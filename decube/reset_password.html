<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сброс пароля</title>
  <link rel="stylesheet" href="/frontend/styles.css?v=reset_1">
  <style>
    .hint { font-size: 14px; opacity: .85; margin: 8px 0 14px; line-height: 1.35; }
    .row { margin: 10px 0; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .btn-link {
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 12px;
      border:1px solid rgba(0,0,0,.15);
      border-radius:6px;
      background:#fff;
      cursor:pointer;
      font-size:14px;
    }
    .status { margin-top: 12px; }
    .status.ok { color: #0a7; }
    .status.err { color: #b00; }
    .small { font-size: 13px; opacity: .85; }
    .tokenbox { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; opacity: .7; word-break: break-all; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="app-container narrow">
    <h2>Сброс пароля</h2>

    <div class="hint">
      Придумай новый пароль (минимум 8 символов).  
      Если токен просрочен — запроси восстановление заново.
      <div id="tokenBox" class="tokenbox"></div>
    </div>

    <form id="frm">
      <div class="row">
        <label>Новый пароль<br>
          <input type="password" id="p1" required autocomplete="new-password">
        </label>
      </div>

      <div class="row">
        <label>Повтор пароля<br>
          <input type="password" id="p2" required autocomplete="new-password">
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="btn">Сохранить пароль</button>
        <a class="btn-link" href="/forgot_password.html">Запросить ссылку заново</a>
        <a class="btn-link" href="/">На главную</a>
      </div>

      <div id="status" class="status small"></div>
    </form>
  </div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const frm = $('frm');
  const btn = $('btn');
  const status = $('status');
  const tokenBox = $('tokenBox');

  const params = new URLSearchParams(location.search);
  const token = (params.get('token') || '').trim();

  tokenBox.textContent = token ? ('token: ' + token) : 'token: (не найден)';

  function setStatus(text, ok){
    status.textContent = text || '';
    status.className = 'status small ' + (ok ? 'ok' : 'err');
  }

  if (!token) {
    setStatus('В ссылке нет токена. Откройте ссылку из письма или запросите новую.', false);
    btn.disabled = true;
  }

  frm.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('', true);

    const p1 = $('p1').value;
    const p2 = $('p2').value;

    if (!token) return;

    if (!p1 || !p2) {
      setStatus('Заполните оба поля пароля.', false);
      return;
    }
    if (p1.length < 8) {
      setStatus('Пароль слишком короткий (минимум 8 символов).', false);
      return;
    }
    if (p1 !== p2) {
      setStatus('Пароли не совпадают.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Сохраняем...';

    try {
      const resp = await fetch('/api/password_reset_finish.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, password: p1, password2: p2 })
      });

      let data = null;
      try { data = await resp.json(); } catch(_) {}

      if (resp.ok && data && data.ok) {
        setStatus('Пароль обновлён. Теперь можно войти.', true);
        // небольшая задержка — потом на главную
        setTimeout(() => { location.href = '/'; }, 900);
        return;
      }

      const err = (data && (data.error || data.err)) || 'unknown_error';

      if (err === 'token_invalid_or_expired') {
        setStatus('Ссылка недействительна или истекла. Запросите восстановление заново.', false);
      } else if (err === 'password_mismatch') {
        setStatus('Пароли не совпадают.', false);
      } else if (err === 'password_too_short') {
        setStatus('Пароль слишком короткий (минимум 8 символов).', false);
      } else if (err === 'missing_parameters') {
        setStatus('Не хватает параметров запроса.', false);
      } else {
        setStatus('Не удалось сохранить пароль. Попробуйте ещё раз или запросите новую ссылку.', false);
      }

    } catch (err) {
      setStatus('Ошибка сети. Попробуйте позже.', false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Сохранить пароль';
    }
  });
})();
</script>
</body>
</html>
