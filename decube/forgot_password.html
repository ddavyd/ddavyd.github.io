<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля</title>
  <link rel="stylesheet" href="/frontend/styles.css?v=forgot_1">
  <style>
    /* аккуратно в стиль проекта: кнопки/поля как обычно, чуть центрируем */
    .hint { font-size: 14px; opacity: .85; margin: 8px 0 14px; line-height: 1.35; }
    .row { margin: 10px 0; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .btn-link {
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 12px;
      border:1px solid rgba(0,0,0,.15);
      border-radius:6px;
      background:#fff;
      cursor:pointer;
      font-size:14px;
    }
    .status { margin-top: 12px; }
    .status.ok { color: #0a7; }
    .status.err { color: #b00; }
    .small { font-size: 13px; opacity: .85; }
  </style>
</head>
<body>

  <div class="app-container narrow">
    <h2>Восстановление пароля</h2>

    <div class="hint">
      Введи <b>логин</b> и (если знаешь) <b>email</b>.  
      Если данные верные — придёт письмо со ссылкой (действует 60 минут).
    </div>

    <form id="frm">
      <div class="row">
        <label>Логин<br>
          <input type="text" id="username" required autocomplete="username">
        </label>
      </div>

      <div class="row">
        <label>Email (необязательно)<br>
          <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="btn">Отправить ссылку</button>
        <a class="btn-link" href="/">Назад</a>
      </div>

      <div id="status" class="status small"></div>
    </form>
  </div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const frm = $('frm');
  const btn = $('btn');
  const status = $('status');

  function setStatus(text, ok){
    status.textContent = text || '';
    status.className = 'status small ' + (ok ? 'ok' : 'err');
  }

  frm.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('', true);

    const username = $('username').value.trim();
    const email = $('email').value.trim();

    if (!username) {
      setStatus('Введите логин.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Отправляем...';

    try {
      const resp = await fetch('/api/password_reset_request.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, email })
      });

      // даже если сервер вернул не 200 — попробуем прочитать JSON
      let data = null;
      try { data = await resp.json(); } catch(_) {}

      // API специально всегда отвечает одинаково
      const msg = (data && (data.message || data.msg)) || 'Если данные верные — письмо отправлено.';
      setStatus(msg, true);

    } catch (err) {
      setStatus('Ошибка сети. Попробуйте позже.', false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Отправить ссылку';
    }
  });
})();
</script>
</body>
</html>
